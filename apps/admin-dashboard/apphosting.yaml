kind: "AppHostingYaml"
schemaVersion: "v1"

runConfig:
  cpu: 1
  memoryMiB: 2048
  concurrency: 80
  minInstances: 0
  maxInstances: 20

scripts:
  build: "pnpm --filter admin-dashboard build"
  run: "pnpm --filter admin-dashboard start"

environmentVariables:
  - variable: "NODE_VERSION"
    value: "20"
